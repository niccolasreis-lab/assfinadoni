name: Payer attribution and financial regressions
on:
  pull_request:
    paths:
      - 'dashboard/lib/payer-attribution*.js'
      - 'dashboard/tests/*payer*.test.js'
      - 'dashboard/tests/helpers/payer-*.js'
      - 'dashboard/handlers/couple.js'
      - 'dashboard/tests/couple-api.test.js'
      - 'dashboard/public/app.js'
      - 'dashboard/public/index.html'
      - 'dashboard/public/styles.css'
      - 'dashboard/package.json'
      - 'dashboard/pnpm-lock.yaml'
      - 'supabase/migrations/**'
      - 'supabase/proposals/**'
      - 'n8n/payer-attribution/**'
      - 'n8n/image-reading/**'
      - 'n8n/outgoing-audio/**'
      - '.github/workflows/payer-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm --dir dashboard install --frozen-lockfile
      - run: node --test --test-concurrency=1
        working-directory: dashboard
        env:
          FINANCE_SQL_TEST_MODULE: '@electric-sql/pglite'
      - run: node n8n/payer-attribution/test.cjs
      - run: node n8n/image-reading/test.cjs
      - run: node n8n/outgoing-audio/test.cjs
      - run: pnpm --dir dashboard run lint
      - run: pnpm --dir dashboard run build
