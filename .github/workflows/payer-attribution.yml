name: Payer attribution rules
on:
  pull_request:
    paths:
      - 'dashboard/lib/payer-attribution.js'
      - 'dashboard/tests/payer-attribution.test.js'
      - 'dashboard/tests/helpers/payer-attribution-cases.js'
      - '.github/workflows/payer-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test dashboard/tests/payer-attribution.test.js
